<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>子网划分计算器</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #607089;
      --line: #cad5e3;
      --blue: #2563a8;
      --blue-dark: #17416f;
      --green: #11755d;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --warn: #a45612;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      background: var(--blue-dark);
      color: white;
      padding: 18px 24px;
      border-bottom: 4px solid #58a6d6;
    }
    header h1 { margin: 0; font-size: 24px; letter-spacing: 0; }
    header p { margin: 6px 0 0; color: #dbeafe; }
    main {
      max-width: 1120px;
      margin: 22px auto;
      padding: 0 18px 32px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 8px 22px rgba(22, 34, 51, 0.06);
    }
    h2 { margin: 0 0 14px; font-size: 18px; color: var(--blue-dark); }
    label { display: block; margin: 12px 0 6px; font-weight: 700; }
    input {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      font-size: 15px;
    }
    button {
      margin-top: 14px;
      width: 100%;
      height: 40px;
      border: 0;
      border-radius: 6px;
      background: var(--blue);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #1f5591; }
    .hint, .error { margin-top: 10px; line-height: 1.55; font-size: 13px; }
    .hint { color: var(--muted); }
    .error { color: #b42318; font-weight: 700; }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #f8fbff;
    }
    .metric span { display: block; color: var(--muted); font-size: 12px; }
    .metric strong { display: block; margin-top: 4px; color: var(--blue-dark); font-size: 16px; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      table-layout: fixed;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 8px 9px;
      text-align: left;
      font-size: 13px;
      word-break: break-word;
    }
    th {
      background: #e8f1fb;
      color: var(--blue-dark);
    }
    .ok { color: var(--green); font-weight: 700; }
    .warn { color: var(--warn); font-weight: 700; }
    @media (max-width: 840px) {
      main { grid-template-columns: 1fr; }
      .summary { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <h1>子网划分计算器</h1>
    <p>输入 IPv4 地址、原始 CIDR 和需要划分的子网数量，计算每个子网的网络地址、广播地址和可用主机范围。</p>
  </header>
  <main>
    <section>
      <h2>输入参数</h2>
      <label for="ip">IPv4 地址</label>
      <input id="ip" value="192.168.10.0" placeholder="例如 192.168.10.0">
      <label for="cidr">原始 CIDR</label>
      <input id="cidr" value="24" placeholder="例如 24">
      <label for="count">子网数量</label>
      <input id="count" value="4" placeholder="例如 4">
      <button id="calc">计算子网</button>
      <div id="message" class="hint">示例：192.168.10.0/24 划分为 4 个子网，结果应得到 /26，每个子网 64 个地址。</div>
    </section>
    <section>
      <h2>计算结果</h2>
      <div id="summary" class="summary"></div>
      <table>
        <thead>
          <tr>
            <th style="width: 9%;">序号</th>
            <th>网络地址</th>
            <th>CIDR</th>
            <th>可用主机范围</th>
            <th>广播地址</th>
            <th>可用主机数</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>
  <script>
    const ipEl = document.getElementById("ip");
    const cidrEl = document.getElementById("cidr");
    const countEl = document.getElementById("count");
    const msgEl = document.getElementById("message");
    const rowsEl = document.getElementById("rows");
    const summaryEl = document.getElementById("summary");

    function parseIp(ip) {
      const parts = ip.trim().split(".");
      if (parts.length !== 4) throw new Error("IPv4 地址必须由 4 段数字组成。");
      let n = 0;
      for (const part of parts) {
        if (!/^\d+$/.test(part)) throw new Error("IPv4 地址只能包含数字和点。");
        const value = Number(part);
        if (value < 0 || value > 255) throw new Error("IPv4 每一段必须在 0 到 255 之间。");
        n = (n << 8) + value;
      }
      return n >>> 0;
    }

    function toIp(n) {
      return [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join(".");
    }

    function ceilLog2(n) {
      let bits = 0;
      let value = 1;
      while (value < n) {
        value *= 2;
        bits += 1;
      }
      return bits;
    }

    function calculate() {
      try {
        const ip = parseIp(ipEl.value);
        const cidr = Number(cidrEl.value);
        const count = Number(countEl.value);
        if (!Number.isInteger(cidr) || cidr < 0 || cidr > 32) throw new Error("CIDR 必须是 0 到 32 的整数。");
        if (!Number.isInteger(count) || count < 1) throw new Error("子网数量必须是大于 0 的整数。");

        const borrowed = ceilLog2(count);
        const newCidr = cidr + borrowed;
        if (newCidr > 32) throw new Error("子网数量过多，已经超过 IPv4 地址位数。");

        const baseSize = 2 ** (32 - cidr);
        const subnetSize = 2 ** (32 - newCidr);
        const mask = cidr === 0 ? 0 : (0xffffffff << (32 - cidr)) >>> 0;
        const baseNetwork = (ip & mask) >>> 0;
        const capacity = 2 ** borrowed;
        const usableHosts = subnetSize <= 2 ? Math.max(subnetSize - 2, 0) : subnetSize - 2;

        summaryEl.innerHTML = [
          ["原始网络", `${toIp(baseNetwork)}/${cidr}`],
          ["新 CIDR", `/${newCidr}`],
          ["实际可划分", `${capacity} 个子网`],
          ["每子网地址数", `${subnetSize} 个`],
        ].map(([k, v]) => `<div class="metric"><span>${k}</span><strong>${v}</strong></div>`).join("");

        rowsEl.innerHTML = "";
        for (let i = 0; i < capacity; i++) {
          const net = (baseNetwork + i * subnetSize) >>> 0;
          const broadcast = (net + subnetSize - 1) >>> 0;
          const first = subnetSize <= 2 ? net : net + 1;
          const last = subnetSize <= 2 ? broadcast : broadcast - 1;
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${i + 1}</td>
            <td>${toIp(net)}</td>
            <td>/${newCidr}</td>
            <td>${toIp(first)} - ${toIp(last)}</td>
            <td>${toIp(broadcast)}</td>
            <td>${usableHosts}</td>`;
          rowsEl.appendChild(tr);
        }

        const extra = capacity === count ? "刚好满足需求。" : `为了满足 ${count} 个子网，需要借 ${borrowed} 位，实际得到 ${capacity} 个子网。`;
        msgEl.className = capacity === count ? "hint ok" : "hint warn";
        msgEl.textContent = extra;
      } catch (err) {
        summaryEl.innerHTML = "";
        rowsEl.innerHTML = "";
        msgEl.className = "error";
        msgEl.textContent = err.message;
      }
    }

    document.getElementById("calc").addEventListener("click", calculate);
    calculate();
  </script>
</body>
</html>
